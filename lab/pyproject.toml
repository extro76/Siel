[project]
name = "siel-lab"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "scikit-learn>=1.5",
  "pydantic>=2.8"
]

[project.optional-dependencies]
semantic = [
  "sentence-transformers>=3.0",
  "torch>=2.3",
  "tqdm>=4.66",
  "faiss-cpu>=1.8; platform_system != 'Windows'"
]

[tool.uv]
package = false
